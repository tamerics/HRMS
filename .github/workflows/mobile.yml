name: Flutter Mobile CI

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze
      - run: flutter test
